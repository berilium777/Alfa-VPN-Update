    fetch('https://api.github.com/repos/berilium777/Alfa-VPN-Update/releases/latest')

        const version = data.tag_name;

        // Finds the first .apk file attached to the latest release
        const apkAsset = data.assets.find(asset => asset.name.endsWith('.apk'));

          document.getElementById('download-btn').href = apkAsset.browser_download_url;

      })
      .catch(() => {
        document.getElementById('version-text').textContent = 'Latest version is available.';
